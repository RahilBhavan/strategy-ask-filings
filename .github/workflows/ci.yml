name: Offline verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11.14', '3.14.0']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare pinned ledger from GitHub and frozen local sources
        run: python scripts/setup_ledger.py
      - name: Offline behavior and CLI regressions
        env:
          PYTHONPATH: tests/offline_guard
        run: python -m unittest discover -s tests -v
      - name: Verify syntax
        run: python -m compileall -q ask_filings scripts tests
